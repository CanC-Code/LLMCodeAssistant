// File: settings.gradle
// Author: CCVO
// Purpose: Configure plugin repositories for Gradle 8+ Android builds

pluginManagement {
    repositories {
        google()              // Required for Android Gradle Plugin
        mavenCentral()        // General-purpose Maven repository
        gradlePluginPortal()  // Fallback for other Gradle plugins
    }
    plugins {
        id "com.android.application" version "8.3.0"
        id "org.jetbrains.kotlin.android" version "1.9.0"
    }
}

rootProject.name = "LLMCodeAssistant"
include(":app")