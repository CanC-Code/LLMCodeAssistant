name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "27.3.10554745"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Assets
        run: |
          ICON_DIR=app/src/main/res/mipmap-xxxhdpi
          mkdir -p $ICON_DIR
          # Generate a 192x192 launcher icon using ImageMagick
          convert -size 192x192 xc:"#2196F3" -gravity center -fill white -font DejaVu-Sans -pointsize 80 -draw "text 0,0 'LLM'" $ICON_DIR/ic_launcher.png
          
          # Generate UI vectors/icons
          mkdir -p app/src/main/res/drawable
          convert -size 48x48 xc:none -fill "#000000" -draw "polygon 12,12 36,24 12,36" app/src/main/res/drawable/ic_send.png

      - name: Build Setup
        run: |
          chmod +x gradlew
          # Verify the correct API is present in llama.h before building
          grep "llama_kv_cache_tokens_rm" external/llama.cpp/include/llama.h || exit 1

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
