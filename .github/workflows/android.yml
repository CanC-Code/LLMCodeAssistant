# File: .github/workflows/android.yml
name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------- Android SDK / NDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745"

      # ---------- Modern Vulkan & glslc Setup ----------
      - name: Install Vulkan SDK and glslc
        run: |
          # Use the official LunarG Vulkan repository for the most reliable SDK tools
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          
          # Install the SDK which includes a guaranteed working glslc
          sudo apt-get install -y \
            vulkan-sdk \
            libvulkan-dev \
            spirv-tools
          
          # Verify glslc is in path
          glslc --version
          echo "Vulkan SDK tools installed successfully"

      # ---------- ImageMagick ----------
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ---------- Generate App Icons ----------
      - name: Generate Android launcher icons
        run: |
          ICON_DIR=app/src/main/res
          BASE_ICON=/tmp/ic_launcher_base.png
          ROUND_ICON=/tmp/ic_launcher_round.png

          convert -size 1024x1024 xc:"#1e1e1e" \
            -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 160 \
            -annotate +0+0 "LLM" "$BASE_ICON"

          convert "$BASE_ICON" \
            \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) \
            -compose copyopacity -composite "$ROUND_ICON"

          mkdir -p $ICON_DIR/mipmap-mdpi $ICON_DIR/mipmap-hdpi $ICON_DIR/mipmap-xhdpi $ICON_DIR/mipmap-xxhdpi $ICON_DIR/mipmap-xxxhdpi
          convert "$BASE_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher.png

          convert "$ROUND_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher_round.png

      # ---------- Generate UI Icons ----------
      - name: Generate FileTree icons
        run: |
          ICON_DIR=app/src/main/res/drawable
          mkdir -p $ICON_DIR
          convert -size 48x48 xc:none -fill "#616161" -stroke black -strokewidth 2 -draw "rectangle 8,8 40,40" -draw "line 8,8 32,8 line 32,8 32,32" "$ICON_DIR/file_icon.png"
          convert -size 48x48 xc:none -fill "#000000" -draw "polygon 16,12 36,24 16,36" "$ICON_DIR/arrow_forward.png"
          convert -size 48x48 xc:none -fill "#000000" -draw "polygon 12,16 24,36 36,16" "$ICON_DIR/arrow_down.png"

      # ---------- Build ----------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      # ---------- Upload ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
