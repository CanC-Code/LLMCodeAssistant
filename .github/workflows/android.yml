# File: .github/workflows/android.yml
# Author: CCVO
# Purpose: Android CI build with submodule initialization + llama.cpp + JNI
name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- Ensure external/llama.cpp exists ----------
      - name: Verify submodule
        run: |
          if [ ! -d "external/llama.cpp" ]; then
            echo "Submodule external/llama.cpp is missing. Initializing..."
            git submodule update --init --recursive
          fi
          ls -l external/llama.cpp

      # ---------- Set up Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------- Set up Android SDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      # ---------- Cache Gradle ----------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      # ---------- Make gradlew executable ----------
      - name: Permissions
        run: chmod +x ./gradlew

      # ---------- Build APK ----------
      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

      # ---------- Upload artifact ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk