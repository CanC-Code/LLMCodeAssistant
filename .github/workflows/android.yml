name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: |
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745"

      - name: Install CMake 3.24.1
        run: |
          CMAKE_VERSION=3.24.1
          CMAKE_DIR=$HOME/cmake-$CMAKE_VERSION
          mkdir -p $CMAKE_DIR
          curl -L -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz
          tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C $CMAKE_DIR
          echo "$CMAKE_DIR/bin" >> $GITHUB_PATH

      - name: Verify llama.cpp headers
        run: |
          if [ ! -f external/llama.cpp/include/llama.h ]; then
            echo "ERROR: llama.h not found"
            exit 1
          fi
          # [span_13](start_span)Verify the specific memory-clearing API from your header[span_13](end_span)
          grep "llama_get_memory" external/llama.cpp/include/llama.h || (echo "API Mismatch detected!" && exit 1)

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
