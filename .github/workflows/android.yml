# File: .github/workflows/android.yml
name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745" # Using the latest stable NDK

      # ---------- ADDED: Install Vulkan SDK & glslc ----------
      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-tools libvulkan-dev vulkan-validationlayers-dev spirv-tools
          # Install glslc specifically for shader compilation
          wget -qO- https://github.com/google/shaderc/releases/download/v2023.7/shaderc-2023.7-linux-x86_64.tar.gz | tar xvz
          echo "$PWD/shaderc-linux-x86_64/bin" >> $GITHUB_PATH

      # ---------- ImageMagick & Icons ----------
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ... [Keep your Icon Generation steps here] ...

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------- Build ----------
      # We pass the VULKAN_SDK path if needed, though the PATH update above usually suffices
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
