name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"

      - name: Install NDK and CMake
        run: |
          # Using NDK 25.1.8937393 which is pre-cached and reliable on the runner
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"
          
          # Explicitly set paths for the build system to use
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Install Vulkan SDK (Host Tools)
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk libvulkan-dev spirv-tools

      - name: Fix Vulkan Header Path
        run: |
          # Inject the NDK's internal Vulkan include directory into CMake.
          # This resolves the 'vulkan/vulkan.hpp' not found error.
          VULKAN_INC="\${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          sed -i "2i include_directories($VULKAN_INC)" app/src/main/cpp/CMakeLists.txt

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate App Icons
        run: |
          ICON_DIR=app/src/main/res
          mkdir -p $ICON_DIR/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          BASE_ICON=/tmp/ic_launcher_base.png
          ROUND_ICON=/tmp/ic_launcher_round.png
          
          convert -size 1024x1024 xc:"#1e1e1e" -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 160 -annotate +0+0 "LLM" "$BASE_ICON"
          convert "$BASE_ICON" \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) -compose copyopacity -composite "$ROUND_ICON"
          
          for res in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            IFS=":" read -r size name <<< "$res"
            convert "$BASE_ICON" -resize ${size}x${size} $ICON_DIR/mipmap-${name}/ic_launcher.png
            convert "$ROUND_ICON" -resize ${size}x${size} $ICON_DIR/mipmap-${name}/ic_launcher_round.png
          done

      - name: Generate UI Drawables
        run: |
          ICON_DIR=app/src/main/res/drawable
          mkdir -p $ICON_DIR
          convert -size 48x48 xc:none -fill "#616161" -stroke black -strokewidth 2 -draw "rectangle 8,8 40,40" -draw "line 8,8 32,8 line 32,8 32,32" "$ICON_DIR/file_icon.png"
          convert -size 48x48 xc:none -fill "#000000" -draw "polygon 16,12 36,24 16,36" "$ICON_DIR/arrow_forward.png"
          convert -size 48x48 xc:none -fill "#000000" -draw "polygon 12,16 24,36 36,16" "$ICON_DIR/arrow_down.png"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
