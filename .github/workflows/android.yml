# File: .github/workflows/android.yml
# Purpose: Android CI build with Vulkan-enabled llama.cpp for Ubuntu 24.04
name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- Ensure submodules exist ----------
      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------- Android SDK / NDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745"

      # ---------- Vulkan SDK & glslc (Robust Fix) ----------
      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          # Use vulkan-utility-libraries-dev to replace the obsolete validationlayers-dev in Noble
          sudo apt-get install -y \
            vulkan-tools \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            spirv-tools
          
      # ---------- Final Robust Fix: Install Vulkan SDK & shaderc (glslc) ----------
      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            vulkan-tools \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            spirv-tools
          
          # Use the official Google Storage API link for shaderc (more stable)
          echo "Downloading shaderc (glslc)..."
          curl -L --retry 5 --connect-timeout 30 \
            https://storage.googleapis.com/shaderc/artifacts/v2023.7/shaderc-linux-x86_64.tar.gz \
            -o shaderc.tar.gz
          
          # Check if the file is valid (expecting ~30MB+)
          FILE_SIZE=$(stat -c%s "shaderc.tar.gz")
          echo "Downloaded file size: $FILE_SIZE bytes"
          
          if [ $FILE_SIZE -lt 1000000 ]; then
            echo "Error: Download failed. The file is too small."
            # Fallback to an alternative mirror if Google Storage fails
            curl -L https://github.com/google/shaderc/releases/download/v2023.7/shaderc-linux-x86_64.tar.gz -o shaderc.tar.gz
          fi

          mkdir -p shaderc_ext
          tar -xzf shaderc.tar.gz -C shaderc_ext --strip-components=1
          echo "$PWD/shaderc_ext/bin" >> $GITHUB_PATH
          echo "glslc successfully added to PATH"


      # ---------- ImageMagick ----------
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ---------- Generate App Icons ----------
      - name: Generate Android launcher icons
        run: |
          ICON_DIR=app/src/main/res
          BASE_ICON=/tmp/ic_launcher_base.png
          ROUND_ICON=/tmp/ic_launcher_round.png

          convert -size 1024x1024 xc:"#1e1e1e" \
            -gravity center \
            -fill white \
            -font DejaVu-Sans-Bold \
            -pointsize 160 \
            -annotate +0+0 "LLM" \
            "$BASE_ICON"

          convert "$BASE_ICON" \
            \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) \
            -compose copyopacity -composite \
            "$ROUND_ICON"

          mkdir -p \
            $ICON_DIR/mipmap-mdpi \
            $ICON_DIR/mipmap-hdpi \
            $ICON_DIR/mipmap-xhdpi \
            $ICON_DIR/mipmap-xxhdpi \
            $ICON_DIR/mipmap-xxxhdpi

          convert "$BASE_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher.png

          convert "$ROUND_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher_round.png

      # ---------- Generate File/Arrow Icons ----------
      - name: Generate FileTree icons
        run: |
          ICON_DIR=app/src/main/res/drawable
          mkdir -p $ICON_DIR

          convert -size 48x48 xc:none \
            -fill "#616161" -stroke black -strokewidth 2 \
            -draw "rectangle 8,8 40,40" \
            -draw "line 8,8 32,8 line 32,8 32,32" \
            "$ICON_DIR/file_icon.png"

          convert -size 48x48 xc:none \
            -fill "#000000" \
            -draw "polygon 16,12 36,24 16,36" \
            "$ICON_DIR/arrow_forward.png"

          convert -size 48x48 xc:none \
            -fill "#000000" \
            -draw "polygon 12,16 24,36 36,16" \
            "$ICON_DIR/arrow_down.png"

      # ---------- Permissions ----------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------- Build ----------
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      # ---------- Upload ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
