name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "27.3.10554745"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Assets
        run: |
          for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$res
          done
          convert -size 512x512 xc:"#1e1e1e" -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 150 -draw "text 0,0 'LLM'" /tmp/icon_base.png
          convert /tmp/icon_base.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_base.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Setup
        run: |
          chmod +x gradlew
          # Updated check for the sequence removal API
          grep "llama_kv_cache_seq_rm" external/llama.cpp/include/llama.h || (echo "API Mismatch: llama_kv_cache_seq_rm not found!" && exit 1)

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
