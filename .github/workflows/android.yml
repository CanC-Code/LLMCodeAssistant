name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Install Vulkan Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-headers # This provides vulkan.hpp

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          # Pass the host's Vulkan header path to the Android build
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Pandroid.externalNativeBuild.cmake.arguments="-DVulkan_INCLUDE_DIR=/usr/include"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
