name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          # Your log specifically mentions a missing NDK. 
          # Ensure this matches exactly what is in your app/build.gradle
          ndk: "27.3.10554745"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate App Icons
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 512x512 xc:"#2196F3" -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 120 -draw "text 0,0 'ACA'" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Setup
        run: |
          chmod +x gradlew
          # Based on your llama-h.txt, llama_memory_clear is the correct modern API
          grep "llama_memory_clear" external/llama.cpp/include/llama.h || (echo "API Mismatch: llama_memory_clear not found!" && exit 1)

      - name: Build Debug APK
        run: |
          # Pass the NDK path explicitly to Gradle to solve the "NDK not configured" error
          ./gradlew :app:assembleDebug \
            -Dandroid.ndkVersion="27.3.10554745" \
            -Dandroid.ndkDirectory="${ANDROID_HOME}/ndk/27.3.10554745" \
            --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
