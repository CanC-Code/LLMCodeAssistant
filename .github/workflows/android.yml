# File: .github/workflows/android.yml
name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- Ensure submodules exist ----------
      - name: Initialize & update submodules
        run: git submodule update --init --recursive

      # ---------- Java ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ---------- Android SDK / NDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: "34.0.0"
          ndk: "27.3.10554745"

      # ---------- Vulkan SDK & glslc (Noble Fixed) ----------
      - name: Install Vulkan SDK (glslc)
        run: |
          sudo apt-get update
          # Use vulkan-utility-libraries-dev (Noble replacement for validationlayers-dev)
          sudo apt-get install -y \
            vulkan-tools \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            spirv-tools
          
          # Robust download logic for shaderc/glslc
          mkdir -p shaderc_temp
          curl -L --retry 5 https://github.com/google/shaderc/releases/download/v2023.7/shaderc-2023.7-linux-x86_64.tar.gz -o shaderc.tar.gz
          
          # Verify file size to prevent 'unexpected end of file' extraction errors
          if [ $(stat -c%s "shaderc.tar.gz") -lt 1000000 ]; then
            echo "Error: Downloaded file is too small, likely corrupted."
            exit 1
          fi

          tar -xzf shaderc.tar.gz
          echo "$PWD/shaderc-linux-x86_64/bin" >> $GITHUB_PATH

      # ---------- ImageMagick ----------
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ---------- Generate Assets & Icons ----------
      - name: Generate Android launcher icons
        run: |
          ICON_DIR=app/src/main/res
          BASE_ICON=/tmp/ic_launcher_base.png
          ROUND_ICON=/tmp/ic_launcher_round.png

          convert -size 1024x1024 xc:"#1e1e1e" \
            -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 160 \
            -annotate +0+0 "LLM" "$BASE_ICON"

          convert "$BASE_ICON" \
            \( -size 1024x1024 xc:none -fill white -draw "circle 512,512 512,0" \) \
            -compose copyopacity -composite "$ROUND_ICON"

          mkdir -p $ICON_DIR/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}

          convert "$BASE_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher.png
          convert "$BASE_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher.png

          convert "$ROUND_ICON" -resize 48x48   $ICON_DIR/mipmap-mdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 72x72   $ICON_DIR/mipmap-hdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 96x96   $ICON_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 144x144 $ICON_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert "$ROUND_ICON" -resize 192x192 $ICON_DIR/mipmap-xxxhdpi/ic_launcher_round.png

      # ---------- Build ----------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        [span_2](start_span)run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace[span_2](end_span)

      # ---------- Upload ----------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLMCodeAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
