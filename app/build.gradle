android {
    namespace 'io.canccode.aca'
    compileSdk 34

    defaultConfig {
        applicationId "io.canccode.aca"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ---------------------------
        // Enable external native build
        // ---------------------------
        externalNativeBuild {
            cmake {
                targets "llama_jni"           // Name of your JNI library
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"  // Android CPU targets
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ---------------------------
    // CMake integration path
    // ---------------------------
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }

    packagingOptions {
        pickFirst "**/*.so"  // Avoid duplicate .so conflicts
    }
}