// File: app/build.gradle
// Author: CCVO
// Purpose: Android application build configuration for LLMCodeAssistant
// Copyright: CanC-code -CCVO

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.llmassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.llmassistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }

        // --- CRITICAL FIX ---
        // Force native code to build in Release mode to avoid massive
        // debug symbols and linker stalls on CI.
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"

            // Let Gradle + Ninja manage parallelism.
            // Manual -j caused CI stalls.
            arguments "-G", "Ninja"
        }
    }

    // Explicit, stable NDK
    ndkVersion "26.1.10909125"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.6'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}