android {
    ndkVersion "26.1.10909125"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-O3"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }
}