plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.canccode.aca'
    compileSdk 34

    defaultConfig {
        applicationId "io.canccode.aca"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

// ------------------ Populate llama.cpp if missing ------------------
tasks.register("populateLlama") {
    doLast {
        def llamaDir = file("${projectDir}/../external/llama.cpp")
        if (!llamaDir.exists() || !new File(llamaDir, "include/llama.h").exists()) {
            println("Populating external/llama.cpp...")

            // Example: clone from GitHub (replace with your runtime method)
            exec {
                commandLine 'git', 'clone', '--depth=1', 'https://github.com/ggerganov/llama.cpp', llamaDir.absolutePath
            }
        } else {
            println("external/llama.cpp already exists, skipping population")
        }
    }
}

// Ensure population happens before the native build
preBuild.dependsOn(tasks.populateLlama)

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}