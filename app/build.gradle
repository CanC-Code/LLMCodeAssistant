plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'io.canccode.aca'
    compileSdk 34

    defaultConfig {
        applicationId "io.canccode.aca"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Essential for LLMs: Qwen 3B requires 64-bit architecture for performance
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // Optimized flags for llama.cpp on Android ARMv8
                // -O3: Maximum optimization
                // -flto: Link-time optimization for cross-file performance
                cppFlags "-std=c++17 -O3 -flto -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared", 
                          "-DLLAMA_K_QUANTS=ON",
                          "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            // Keep debug fast, no minification
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        release {
            // CRITICAL: Minification helps reduce the binary footprint of the LLM bridge
            minifyEnabled true 
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // UI & Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"

    // Architecture Components (Critical for LLMFragment)
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.6"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.6"

    // Storage & Performance
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
